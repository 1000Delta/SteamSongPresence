name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified build to GitHub Releases
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out plugin source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out pinned compile-only references
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: beat-forge/beatsaber-stripped
          ref: 1e0c733914698d3a7932b7a88f7f8bd5eb74903a
          path: Refs
          persist-credentials: false
      - name: Set up pinned Microsoft SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.404'
      - name: Build from source, run checks and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $deps = Get-Content ci/dependencies.json -Raw | ConvertFrom-Json
          # setup-dotnet installs an SDK; global.json also forces its selection.
          @{ sdk = @{ version = $deps.dotnetSdk; rollForward = 'disable'; allowPrerelease = $false } } | ConvertTo-Json -Depth 3 | Set-Content global.json -Encoding utf8NoBOM
          if ((dotnet --version).Trim() -ne $deps.dotnetSdk) { throw 'SDK version mismatch.' }
          dotnet --info
          $refs = Join-Path $env:GITHUB_WORKSPACE 'Refs'
          if ((git -C $refs rev-parse HEAD).Trim() -ne $deps.referenceCommit) { throw 'Reference commit mismatch.' }
          $cecil = ./ci/prepare-test-dependencies.ps1
          ./build.ps1 -GameDir $refs -TargetVersion $deps.gameVersion -TestTargetFramework net10.0 -CecilPath $cecil
          ./ci/verify-package.ps1 -GameDir $refs -CecilPath $cecil
      - name: Store audited build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SteamSongPresence-release
          path: |
            dist/SteamSongPresence-*-bs1.40.8.zip
            dist/SHA256SUMS.txt
            dist/BUILDINFO.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: >-
      github.repository == '1000Delta/SteamSongPresence' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release) ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release notes at the built source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download this run's verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SteamSongPresence-release
          path: release-assets
      - name: Sign build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release-assets/*'
      - name: Publish artifacts generated by this run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check SHA256SUMS.txt
          cd ..
          version=$(jq -r .version manifest.json)
          tag="v${version}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo 'Tag does not match manifest version' >&2
            exit 1
          fi
          gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --title "Steam Song Presence ${tag} — Beat Saber 1.40.8" --notes-file RELEASE.md

